<!-- html/vault.html
     Chrono-Calibration & Access Console — Futuristic Interstellar / Vision Pro HUD Dashboard
-->
<section class="max-width-container vault-section" id="vault">
  <div class="centered-console-card border-grid" id="calibrationConsoleCard">
    <div class="hud-scanline-overlay"></div>

    <!-- Header Panel -->
    <header class="console-card-header font-display">
      <div class="hud-header-left">
        <span class="console-logo-dot"></span>
        <span class="hud-title font-display">CHRONO-CALIBRATION &amp; ACCESS MATRIX</span>
        <span class="hud-subtitle font-mono">QUANTUM LOCK v2026</span>
      </div>
      <div class="hud-header-right">
        <div class="hud-status-badge border-grid">
          <span class="hud-status-pulse"></span>
          <span class="hud-status-text font-mono">FREQ: 880 Hz</span>
        </div>
        <div class="hud-sync-score-card border-grid">
          <span class="hud-score-label font-mono">SYNC SCORE</span>
          <span class="hud-score-val font-mono text-coral" id="hudSyncScoreValue">50%</span>
        </div>
      </div>
    </header>

    <div class="console-card-body">
      <!-- Left Panel: Chrono Identity & Vibe Matrix -->
      <div class="console-body-left">
        <form class="terminal-form" id="chronoForm" autocomplete="off" onsubmit="return false;">

          <!-- Concentric Circular Dials & Radar Canvas Matrix -->
          <div class="calibration-container border-grid">
            <div class="calibration-radar-col">
              <div class="calibration-title font-mono text-coral">VIBE VECTOR MATRIX</div>
              <div class="radar-hud-wrapper">
                <div class="radar-hud-ring"></div>
                <canvas id="radarCanvas" width="120" height="120" class="radar-canvas"></canvas>
              </div>
              <div class="radar-sync-tag font-mono text-ash" id="radarSyncTag">VECTOR: CALIBRATED</div>
            </div>
            <div class="calibration-dials-col" id="calibrationDialsRow">
              <div class="dial-container-slot" id="dialOpennessSlot"></div>
              <div class="dial-container-slot" id="dialDepthSlot"></div>
              <div class="dial-container-slot" id="dialEnergySlot"></div>
            </div>
          </div>

          <!-- Actions & Submission Button -->
          <div class="terminal-actions">
            <button type="submit" class="btn-terminal-submit nav-interactive" id="submitBtn">
              ⚡ Verify &amp; Transmit Vibe Calibration Pass
            </button>
          </div>
        </form>
      </div>

      <!-- Right Panel: Timeline Synchronization Log & Telemetry Pod -->
      <div class="console-body-right">
        <!-- Timeline Synchronization Log Screen -->
        <div class="terminal-box border-grid" id="terminalBox">
          <div class="terminal-header">
            <div class="terminal-status-badge">
              <span class="status-pulse-active"></span>
              <span class="terminal-title font-mono">TIMELINE SYNCHRONIZATION LOG</span>
            </div>
            <div class="terminal-indicator-nodes">
              <span class="indicator-node active"></span>
              <span class="indicator-node" id="dotProgress2"></span>
              <span class="indicator-node" id="dotProgress3"></span>
            </div>
          </div>
          <div class="terminal-screen">
            <div class="terminal-output font-mono" id="terminalOutput"></div>
          </div>
        </div>

        <!-- Temporal Match Telemetry Pod -->
        <div class="telemetry-pod-card border-grid">
          <div class="telemetry-pod-header font-mono">
            <span class="status-pulse-active status-pulse-active--sm"></span>
            <span class="telemetry-pod-title">TEMPORAL MATCH TELEMETRY</span>
          </div>

          <div class="telemetry-stats-grid font-mono">
            <div class="telemetry-stat-item">
              <span class="telemetry-stat-label">VIBE ALIGNMENT</span>
              <span class="telemetry-stat-val text-coral" id="telemetryMatchVal">94% MATCH</span>
            </div>
            <div class="telemetry-stat-item">
              <span class="telemetry-stat-label">TABLE CAPACITY</span>
              <span class="telemetry-stat-val text-gold">6 STRANGERS</span>
            </div>
            <div class="telemetry-stat-item">
              <span class="telemetry-stat-label">SECRET VILLA COORDS</span>
              <span class="telemetry-stat-val text-bone">2H PRIOR VIA WHATSAPP</span>
            </div>
            <div class="telemetry-stat-item">
              <span class="telemetry-stat-label">SOUND PROTOCOL</span>
              <span class="telemetry-stat-val text-coral">880 Hz ACTIVE</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
