<main class="max-width-container hero-section" id="hero">
    <div class="hero-immersive-card">
      <div class="manifesto-subtitle">Kala Chakra · The Indian Time Loop</div>
      <h1 class="manifesto-title font-display">TIME STOPS AT THE TABLE</h1>
      <p class="manifesto-description manifesto-description--centered">
        "Time stops at the table. A multi-course dining experiment frozen in time, hosted for exactly 25 members in the secrecy of a private villa."
      </p>

      <!-- Orbital countdown clock -->
      <div class="clock-orbital-container" id="chronoClock">
        <div class="clock-orbital-segment">
          <div class="clock-orbital-digit" id="daysBox">00</div>
          <span class="clock-orbital-label">DAYS</span>
        </div>
        <div class="clock-orbital-divider">:</div>
        <div class="clock-orbital-segment">
          <div class="clock-orbital-digit" id="hoursBox">00</div>
          <span class="clock-orbital-label">HOURS</span>
        </div>
        <div class="clock-orbital-divider">:</div>
        <div class="clock-orbital-segment">
          <div class="clock-orbital-digit" id="minutesBox">00</div>
          <span class="clock-orbital-label">MINS</span>
        </div>
        <div class="clock-orbital-divider">:</div>
        <div class="clock-orbital-segment">
          <div class="clock-orbital-digit" id="secondsBox">00</div>
          <span class="clock-orbital-label">SECS</span>
        </div>
      </div>

      <!-- Club Selector — populated by renderer.js → renderClubCards() -->
      <div class="club-selector-strip" style="margin-top: 3rem; margin-bottom: 2rem;">
        <div class="club-selector-label">SELECT YOUR SUPPER CLUB</div>
        <div class="club-cards-row" id="clubCardsRow"></div>
      </div>

      <div class="hero-cta-row">
        <a href="#schematic" class="btn-pill btn-coral nav-interactive">Explore Dining Layout <span class="arrow">↓</span></a>
      </div>

    </div>
  </main>
