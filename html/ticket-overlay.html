<!-- html/ticket-overlay.html
     Apple Wallet & Rolex Inspired Digital Ticket Overlay & Verification Modal
-->
<div id="ticketOverlay" class="overlay-backdrop overlay-backdrop--hidden">
  <div class="luxury-ticket-modal-panel max-width-container">
    <header class="luxury-ticket-top-nav border-grid">
      <div class="ticket-nav-title">
        <span class="label-mono text-gold font-mono">BEYOND THYME VERIFICATION PASSPORT</span>
      </div>
      <button class="ticket-modal-close-btn nav-interactive" id="closeTicketOverlayBtn" aria-label="Close Ticket Overlay">
        &times;
      </button>
    </header>

    <!-- Main Render Container for Digital Ticket -->
    <main class="luxury-ticket-render-wrapper" id="ticketOverlayContainer">
      <!-- Injected via modules/ticket.js -->
    </main>

    <!-- Action Button Controls Bar -->
    <footer class="luxury-ticket-actions-bar border-grid">
      <button class="btn-pill btn-ticket-action btn-ticket-pdf nav-interactive" id="btnDownloadTicketPDF">
        📄 DOWNLOAD PDF
      </button>
      <button class="btn-pill btn-ticket-action btn-ticket-png nav-interactive" id="btnDownloadTicketPNG">
        🖼️ DOWNLOAD PNG
      </button>
      <button class="btn-pill btn-ticket-action btn-ticket-whatsapp nav-interactive" id="btnShareTicketWhatsApp">
        💬 SHARE WHATSAPP
      </button>
      <button class="btn-pill btn-ticket-action btn-ticket-email nav-interactive" id="btnMailTicketEmail">
        ✉️ DISPATCH EMAIL
      </button>
    </footer>
  </div>
</div>
