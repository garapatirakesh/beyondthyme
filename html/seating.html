<section class="max-width-container seating-section" id="schematic">

    <!-- Dark Timepiece Configurator Card -->
    <div class="dark-timepiece-card border-grid">
      <div class="dark-timepiece-header">
        <div class="table-capacity-pill">TABLE 01 · CAPACITY: 25 SEATS · 360° ORBITAL CHRONO</div>
      </div>

      <div class="schematic-visualizer dark-schematic-bg" id="schematicVisualizer">
        <!-- SVG Glowing Orbital Track Ellipse -->
        <svg class="orbital-track-svg" viewBox="0 0 1000 500" preserveAspectRatio="none">
          <ellipse cx="500" cy="250" rx="430" ry="175" class="orbital-ellipse-path" />
        </svg>

        <!-- 3D Watch Model Canvas Box -->
        <div id="watch3DContainer" class="watch-3d-canvas-box"></div>

        <!-- Dynamic 25 Chrono-Seat Ring Container -->
        <div id="orbitalSeatRing" class="orbital-seat-ring"></div>
      </div>

      <!-- Luxury Status Legend Strip -->
      <div class="dark-legend-strip">
        <div class="dark-legend-item">
          <div class="dark-legend-icon dark-legend-icon--open"></div>
          <span>AVAILABLE</span>
        </div>
        <div class="dark-legend-item">
          <div class="dark-legend-icon dark-legend-icon--booked">👤</div>
          <span>BOOKED</span>
        </div>
        <div class="dark-legend-item">
          <div class="dark-legend-icon dark-legend-icon--selected"></div>
          <span>SELECTED</span>
        </div>
      </div>
    </div>
  </section>
