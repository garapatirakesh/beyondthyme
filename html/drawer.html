<!-- Floating Vertical Archives Drawer Trigger -->
  <button id="btnToggleArchives" class="floating-archives-tab nav-interactive" aria-label="Toggle Past Sessions Log">
    <span>ARCHIVED SESSIONS ☰</span>
  </button>

  <!-- Left Slide-out Archives Drawer -->
  <aside id="archivesDrawer" class="archives-drawer">
    <div class="archives-drawer-header">
      <h3 class="font-display">Archived Sessions</h3>
      <button id="btnCloseArchives" class="archives-close-btn nav-interactive">&times;</button>
    </div>
    <p class="archives-drawer-lead font-mono">Select a past dinner event to view historical seating maps and configuration records.</p>
    <div class="archived-drawer-cards" id="archivedDrawerCards"></div>
  </aside>
