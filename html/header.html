<!-- html/header.html
     Ultra-Luxury Floating Glassmorphic Header Navigation Bar
-->
<header class="header-sticky">
  <div class="max-width-container">
    <nav class="nav-container">
      <!-- Logo -->
      <a href="#" class="logo font-display nav-interactive">
        <img src="/logo.jpg" alt="Beyond Thyme Logo" class="logo-avatar-img">
        <span class="logo-wordmark">beyond <span class="italic">thyme</span></span>
      </a>

      <!-- Navigation Links -->
      <ul class="nav-links">
        <li><a href="#manifesto" class="nav-interactive nav-link font-mono">Manifesto</a></li>
        <li><a href="#eras" class="nav-interactive nav-link font-mono">Eras of Flavor</a></li>
        <li><a href="#community" class="nav-interactive nav-link font-mono">Community</a></li>
      </ul>

      <!-- Luxury Action Controls Bar -->
      <div class="nav-actions">
        <!-- Audio Protocol Toggle -->
        <button id="audioToggleBtn" class="btn-pill btn-ghost btn-audio nav-interactive" aria-label="Toggle Sound Protocol">
          <span class="audio-pulse" id="audioPulse"></span>
          <span class="audio-label font-mono">SOUND: OFF</span>
        </button>

        <!-- Auth / Login Button -->
        <button id="headerLoginBtn" class="btn-pill btn-ghost nav-interactive" aria-label="Login">
          <span class="ticket-icon">👤</span>
          <span class="ticket-label font-mono" id="headerLoginText">LOGIN</span>
        </button>

        <!-- My Tickets Drawer Button -->
        <button id="myTicketsNavBtn" class="btn-pill btn-ghost nav-interactive" aria-label="My Tickets">
          <span class="ticket-icon">🎟️</span>
          <span class="ticket-label font-mono">My Tickets</span>
        </button>

        <!-- Primary Action CTA -->
        <a href="#schematic" class="btn-pill btn-coral nav-interactive">
          <span class="cta-label font-mono">Reserve Seat</span>
          <span class="arrow">&rarr;</span>
        </a>
      </div>
    </nav>
  </div>
</header>
