<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyond Thyme - Symmetric Booking Layout</title>
    <style>
        :root {
            --color-beige-dark: #ded6c5;
            --color-beige-light: #f6f1e5;
            --color-black: #111111;
            --color-neon-orange: #ff5e00;
            --color-neon-glow: rgba(21, 204, 58, 0.4);
            --card-w: 42px;
            --card-h: 62px;
            --center-x: 400px;
            --center-y: 340px;
            --radius-x: 325px;
            --radius-y: 215px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-beige-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .layout-container {
            width: 800px;
            height: 680px;
            background-color: var(--color-beige-light);
            border-radius: 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .poker-table {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 530px;
            height: 310px;
            background: var(--color-black);
            border-radius: 155px;
            border: 14px solid var(--color-neon-orange);
            box-shadow: 0 0 30px var(--color-neon-glow), inset 0 0 20px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .poker-table::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px dashed var(--color-neon-orange);
            border-radius: 145px;
            opacity: 0.5;
        }

        .table-title {
            color: var(--color-neon-orange);
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 5px;
            margin: 0 0 6px 0;
            text-shadow: 0 0 10px var(--color-neon-glow);
        }

        .table-subtitle {
            color: var(--color-beige-dark);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0;
        }

        .seat-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 5;
        }

        .seat {
            position: absolute;
            width: var(--card-w);
            height: var(--card-h);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease, background-color 0.2s, color 0.2s;
            left: calc(var(--center-x) - (var(--card-w) / 2));
            top: calc(var(--center-y) - (var(--card-h) / 2));
            transform: translate(calc(var(--radius-x) * cos(var(--angle))), calc(var(--radius-y) * sin(var(--angle)))) rotate(calc(var(--angle) + 90deg));
        }

        .seat:hover {
            z-index: 20;
            transform: translate(calc((var(--radius-x) + 8px) * cos(var(--angle))), calc((var(--radius-y) + 8px) * sin(var(--angle)))) rotate(calc(var(--angle) + 90deg)) scale(1.05);
        }

        .seat.black-card {
            background-color: var(--color-black);
            color: var(--color-beige-dark);
            border: 1px solid var(--color-beige-dark);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .seat.white-card {
            background-color: var(--color-beige-light);
            color: var(--color-black);
            border: 2px solid var(--color-black);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .status-dot {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 5px;
            height: 5px;
            background-color: var(--color-neon-orange);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--color-neon-orange);
        }

        .seat:active,
        .seat.booked {
            background-color: var(--color-neon-orange) !important;
            color: var(--color-black) !important;
            border: 2px solid var(--color-black) !important;
            box-shadow: 0 0 15px var(--color-neon-orange) !important;
        }

        .p-1 {
            --angle: -150deg;
        }

        .p-2 {
            --angle: -136deg;
        }

        .p-3 {
            --angle: -122deg;
        }

        .p-4 {
            --angle: -108deg;
        }

        .p-5 {
            --angle: -94deg;
        }

        .p-6 {
            --angle: -80deg;
        }

        .p-7 {
            --angle: -66deg;
        }

        .p-8 {
            --angle: -52deg;
        }

        .p-9 {
            --angle: -38deg;
        }

        .p-10 {
            --angle: -24deg;
        }

        .p-11 {
            --angle: -10deg;
        }

        .p-12 {
            --angle: 10deg;
        }

        .p-13 {
            --angle: 24deg;
        }

        .p-14 {
            --angle: 38deg;
        }

        .p-15 {
            --angle: 52deg;
        }

        .p-16 {
            --angle: 66deg;
        }

        .p-17 {
            --angle: 80deg;
        }

        .p-18 {
            --angle: 94deg;
        }

        .p-19 {
            --angle: 108deg;
        }

        .p-20 {
            --angle: 122deg;
        }

        .p-21 {
            --angle: 136deg;
        }

        .p-22 {
            --angle: 150deg;
        }

        .p-23 {
            --angle: 165deg;
        }

        .p-24 {
            --angle: 180deg;
        }

        .p-25 {
            --angle: -165deg;
        }
    </style>
</head>

<body>
    <div class="layout-container">
        <div class="seat-ring">
            <div class="seat black-card p-1" onclick="this.classList.toggle('booked')">1</div>
            <div class="seat black-card p-2" onclick="this.classList.toggle('booked')">A</div>
            <div class="seat black-card p-3" onclick="this.classList.toggle('booked')">A</div>
            <div class="seat black-card p-4" onclick="this.classList.toggle('booked')">K</div>
            <div class="seat black-card p-5" onclick="this.classList.toggle('booked')">V</div>
            <div class="seat white-card p-6" onclick="this.classList.toggle('booked')">12<span
                    class="status-dot"></span></div>
            <div class="seat black-card p-7" onclick="this.classList.toggle('booked')">A</div>
            <div class="seat black-card p-8" onclick="this.classList.toggle('booked')">K</div>
            <div class="seat black-card p-9" onclick="this.classList.toggle('booked')">V</div>
            <div class="seat white-card p-10" onclick="this.classList.toggle('booked')">12<span
                    class="status-dot"></span></div>
            <div class="seat white-card p-11" onclick="this.classList.toggle('booked')">13<span
                    class="status-dot"></span></div>
            <div class="seat white-card p-12" onclick="this.classList.toggle('booked')">22</div>
            <div class="seat black-card p-13" onclick="this.classList.toggle('booked')">21</div>
            <div class="seat black-card p-14" onclick="this.classList.toggle('booked')">9</div>
            <div class="seat white-card p-15" onclick="this.classList.toggle('booked')">20</div>
            <div class="seat black-card p-16" onclick="this.classList.toggle('booked')">16</div>
            <div class="seat black-card p-17" onclick="this.classList.toggle('booked')">15</div>
            <div class="seat white-card p-18" onclick="this.classList.toggle('booked')">14<span
                    class="status-dot"></span></div>
            <div class="seat white-card p-19" onclick="this.classList.toggle('booked')">13</div>
            <div class="seat white-card p-20" onclick="this.classList.toggle('booked')">17<span
                    class="status-dot"></span></div>
            <div class="seat white-card p-21" onclick="this.classList.toggle('booked')">26</div>
            <div class="seat white-card p-22" onclick="this.classList.toggle('booked')">25<span
                    class="status-dot"></span></div>
            <div class="seat white-card p-23" onclick="this.classList.toggle('booked')">1</div>
            <div class="seat white-card p-24" onclick="this.classList.toggle('booked')">5<span
                    class="status-dot"></span></div>
            <div class="seat white-card p-25" onclick="this.classList.toggle('booked')">17</div>
        </div>
        <div class="poker-table">
            <h1 class="table-title">BEYOND THYME</h1>
            <p class="table-subtitle">Grand Villa Banquet • 25 Positions</p>
        </div>
    </div>
</body>

</html>
